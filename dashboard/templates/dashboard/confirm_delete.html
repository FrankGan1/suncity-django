{% extends "dashboard/_layout.html" %}

{% block title %}Delete Client — Suncity Django Admin{% endblock %}

{% block dash_content %}
<div class="confirm-card">
  <div class="card">
    <h2 style="margin-top:0;">Delete this client?</h2>
    <p style="color: var(--ink-500);">
      You're about to permanently delete <strong>{{ client.full_name }}</strong>
      ({{ client.email }}). This cannot be undone.
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="confirm-actions">
        <button type="submit" class="btn btn-danger">Yes, Delete Client</button>
        <a href="{% url 'dashboard:home' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
